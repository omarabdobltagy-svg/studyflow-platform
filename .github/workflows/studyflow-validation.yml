name: StudyFlow validation

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test-password
          MYSQL_DATABASE: studyflow_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptest-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    env:
      DATABASE_URL: mysql://root:test-password@127.0.0.1:3306/studyflow_test
      JWT_SECRET: ci-only-test-secret-not-for-production
      NODE_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Extract application source and apply overlays
        run: |
          tar -xf studyflow-source.tar -C .
          cp -a overrides/. .
          test -f package.json
          test -f pnpm-lock.yaml
          test -f server/_core/index.ts
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm check
      - name: Build
        run: pnpm build
      - name: Apply all MySQL migrations on an isolated database
        run: pnpm db:push
      - name: Verify additive deployment migrations are idempotent
        run: |
          node scripts/migrate-local-auth.mjs
          node scripts/migrate-local-auth.mjs
          node -e "const mysql=require('mysql2/promise'); (async()=>{const c=await mysql.createConnection(process.env.DATABASE_URL); for (const table of ['assistantConversations','assistantMessages']) { const [rows]=await c.query('SHOW TABLES LIKE ?', [table]); if (!rows.length) throw new Error(table + ' migration did not create its table'); } const [markers]=await c.query('SELECT id FROM studyflow_migrations WHERE id = ?', ['2026-11-assistant-conversations']); if (markers.length !== 1) throw new Error('assistant migration marker missing or duplicated'); await c.end(); })().catch(e=>{console.error(e);process.exit(1)});"
      - name: Unit tests
        run: pnpm test
      - name: Install Playwright for built-app responsive visual QA
        env:
          PLAYWRIGHT_DIR: ${{ runner.temp }}/studyflow-playwright
        run: |
          mkdir -p "$PLAYWRIGHT_DIR"
          npm install --prefix "$PLAYWRIGHT_DIR" --no-save --no-package-lock --no-audit --no-fund playwright@1.57.0
          "$PLAYWRIGHT_DIR/node_modules/.bin/playwright" install --with-deps chromium
      - name: Test the built application in Chromium at mobile, tablet and desktop sizes
        env:
          NODE_PATH: ${{ runner.temp }}/studyflow-playwright/node_modules
        run: |
          set -euo pipefail
          PORT=4173 node dist/index.js > "$RUNNER_TEMP/studyflow-visual-qa-server.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          READY=""
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              READY="yes"
              break
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              cat "$RUNNER_TEMP/studyflow-visual-qa-server.log"
              exit 1
            fi
            sleep 1
          done
          if [ "$READY" != "yes" ]; then
            cat "$RUNNER_TEMP/studyflow-visual-qa-server.log"
            echo "Built StudyFlow server did not become healthy within 60 seconds."
            exit 1
          fi
          STUDYFLOW_QA_URL=http://127.0.0.1:4173 node scripts/visual-qa.cjs
      - name: Upload desktop, tablet and mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studyflow-responsive-visual-qa
          path: artifacts/visual-qa/
          if-no-files-found: warn
